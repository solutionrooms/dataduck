[project]
name = "duckbricks"
version = "0.0.1"
description = "A local, single-user, Databricks-shaped data platform on DuckDB, DuckLake and dbt v2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb==2.0.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pytz>=2026.5",
    "croniter>=6.2.4",
    "jsonschema>=4.26.0",
    "mcp>=2.3.0",
    "sqlglot>=30.24.0",
]

[project.scripts]
dbk = "duckbricks.cli.main:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "types-pytz>=2026.5.0.20261006",
    "types-croniter>=6.2.4.20261006",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duckbricks"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the Docker Compose stack (make up)",
]
addopts = "-m 'not integration'"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/duckbricks/core", "src/duckbricks/bundles"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true
