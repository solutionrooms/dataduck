models:
  - name: orders
    description: One row per order, typed and deduplicated
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [completed, shipped, cancelled, returned]
  - name: customers
    description: One row per customer
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
