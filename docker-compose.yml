name: duckbricks

x-dbk-env: &dbk-env
  DBK_PG_HOST: postgres
  DBK_PG_PORT: "5432"
  DBK_PG_USER: ${DBK_PG_USER:?set in .env}
  DBK_PG_PASSWORD: ${DBK_PG_PASSWORD:?set in .env}
  DBK_S3_ENDPOINT: seaweedfs:8333
  DBK_S3_ACCESS_KEY: ${DBK_S3_ACCESS_KEY:?set in .env}
  DBK_S3_SECRET_KEY: ${DBK_S3_SECRET_KEY:?set in .env}
  DBK_TOKEN: ${DBK_TOKEN:?set in .env}
  DBK_NODE_TYPES_FILE: /app/config/node_types.yml
  DBK_USER_NAME: ${DBK_USER_NAME:-user@duckbricks.local}
  DBK_HOST: http://api:8080
  DBK_PUBLIC_URL: http://127.0.0.1:${DBK_API_PORT:-8080}
  DBK_WORKSPACE_ROOT: /data/workspace
  DBK_LOGS_ROOT: /data/logs
  DBK_WAREHOUSE_AGENT_URL: http://warehouse:9400
  DBK_WAREHOUSE_HOST: warehouse
  DBK_WAREHOUSE_TOKEN: ${DBK_WAREHOUSE_TOKEN:?set in .env}
  DBK_NOTEBOOKS_URL: http://127.0.0.1:${DBK_NOTEBOOKS_PORT:-2718}
  DBK_NOTEBOOKS_TOKEN: ${DBK_NOTEBOOKS_TOKEN:?set in .env}
  # Optional Databricks workspace for live foreign catalogs and the mirror (ADR 0013).
  DATABRICKS_HOST: ${DATABRICKS_HOST:-}
  DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
  DATABRICKS_WAREHOUSE_ID: ${DATABRICKS_WAREHOUSE_ID:-}

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${DBK_PG_USER}
      POSTGRES_PASSWORD: ${DBK_PG_PASSWORD}
    ports:
      - "127.0.0.1:${DBK_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d lake"]
      interval: 3s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "/opt/dbk/entrypoint.sh"]
    environment:
      DBK_S3_ACCESS_KEY: ${DBK_S3_ACCESS_KEY}
      DBK_S3_SECRET_KEY: ${DBK_S3_SECRET_KEY}
    ports:
      - "127.0.0.1:${DBK_S3_PORT:-8333}:8333"
    volumes:
      - seaweeddata:/data
      - ./docker/seaweedfs:/opt/dbk:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null && wget -q --spider http://127.0.0.1:8333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 30

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "/opt/dbk/create-buckets.sh"]
    environment:
      DBK_BUCKETS: lakehouse landing
    volumes:
      - ./docker/seaweedfs:/opt/dbk:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    image: duckbricks-api:dev
    environment:
      <<: *dbk-env
    ports:
      - "127.0.0.1:${DBK_API_PORT:-8080}:8080"
    volumes:
      - workspace:/data/workspace
      - logs:/data/logs
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
      args:
        DBT_DISTRIBUTION: ${DBK_DBT_DISTRIBUTION:-full}
    image: duckbricks-worker:dev
    environment:
      <<: *dbk-env
      DBK_WORKER_SLOTS: ${DBK_WORKER_SLOTS:-4}
    volumes:
      - workspace:/data/workspace
      - logs:/data/logs
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 20s

  warehouse:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: warehouse
    image: duckbricks-warehouse:dev
    environment:
      <<: *dbk-env
    ports:
      # Quack servers, one port per running warehouse, for DuckDB clients on the host.
      - "127.0.0.1:9500-9509:9500-9509"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9400/health', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 4s
      retries: 30

  notebooks:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: notebooks
    image: duckbricks-notebooks:dev
    environment:
      <<: *dbk-env
    ports:
      - "127.0.0.1:${DBK_NOTEBOOKS_PORT:-2718}:2718"
    volumes:
      - workspace:/data/workspace
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  seaweeddata:
  workspace:
  logs:
